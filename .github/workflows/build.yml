name: Build, test and release
on:
  push:
    branches: [main, master]
    tags: ['v1.*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Offline regression tests
        shell: pwsh
        run: ./test.ps1
      - name: Obtain verified Inno Setup compiler
        shell: pwsh
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $compiler)) {
            $setup = Join-Path $env:RUNNER_TEMP 'innosetup.exe'
            Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_4/innosetup-6.7.4.exe' -OutFile $setup
            if ((Get-AuthenticodeSignature $setup).Status -ne 'Valid') { throw 'Invalid Inno Setup signature' }
            Start-Process $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/ALLUSERS' -Wait -WindowStyle Hidden
          }
          if (-not (Test-Path $compiler)) { throw 'Inno Setup compiler missing' }
          "INNO_COMPILER=$compiler" >> $env:GITHUB_ENV
      - name: Build portable and setup
        shell: pwsh
        run: ./build.ps1 -Installer -Compiler $env:INNO_COMPILER
      - name: Source and checksums
        shell: pwsh
        run: |
          git archive --format=zip --output=artifacts/PoolDesk-1.1.2-source.zip HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Source archive failed' }
          Get-ChildItem artifacts -File | Where-Object Extension -In '.zip','.exe' | ForEach-Object {
            '{0}  {1}' -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name
          } | Set-Content artifacts/SHA256SUMS.txt -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: PoolDesk-1.1.2
          path: |
            artifacts/*.zip
            artifacts/*.exe
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v1.')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: PoolDesk-1.1.2
          path: artifacts
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -ne 'v1.1.2') { throw 'Update project and artifact versions before tagging another version' }
          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -eq 0) { Write-Output 'Release already exists; leaving its files untouched'; exit 0 }
          $files = (Get-ChildItem artifacts -File).FullName
          gh release create $env:RELEASE_TAG @files --verify-tag --title 'PoolDesk 1.1.2' --notes-file RELEASE-NOTES.md --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
